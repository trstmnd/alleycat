name: pages

on:
  push:
    branches-ignore:
      - gh-pages

# Aucun droit par defaut : chaque job demande exactement ce qu'il lui faut.
permissions:
  contents: read

concurrency:
  group: gh-pages

jobs:
  # 1. Controler, construire, et accumuler dans gh-pages. Cette branche n'est
  #    plus servie directement par Pages, elle sert de reserve : la racine porte
  #    le jeu, preview/<branche> porte chaque branche. C'est `keep_files` qui
  #    permet a une preview de survivre a une livraison sur main.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # Epinglee au SHA du commit, pas au tag : un tag se deplace, un SHA non.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Controles
        run: sh check.sh

      - name: Construire _site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html style.css _site/
          cp -r src _site/
          # Jekyll ne doit pas toucher au site. peaceiris le pose deja, on ne
          # depend pas de lui pour un fichier aussi structurant.
          touch _site/.nojekyll
          # Empreinte de la livraison. Elle change a chaque commit, donc chaque
          # push produit un vrai commit sur gh-pages et le site est redeploye.
          # C'est aussi la seule sonde pour savoir ce qui est REELLEMENT en
          # ligne : ouvrir /version.txt repond le SHA servi.
          {
            echo "commit  $GITHUB_SHA"
            echo "branche $GITHUB_REF_NAME"
            echo "publie  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > _site/version.txt

      - name: Calculer le dossier de destination
        id: dest
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
          else
            echo "dir=preview/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier sur gh-pages
        # Action tierce qui tourne avec contents:write : epinglee au SHA.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
          destination_dir: ${{ steps.dest.outputs.dir }}

  # 2. Mettre gh-pages en ligne.
  #
  #    Pourquoi ce job existe : GitHub Pages n'etait pas active sur ce depot, et
  #    il ne peut pas l'etre a la main sans passer par l'interface web. La voie
  #    API directe est fermee au jeton d'Actions, qui recoit
  #    "Resource not accessible by integration" sur la creation d'un site en
  #    mode branche, meme avec pages:write accorde. Le seul chemin automatisable
  #    est le mode officiel "GitHub Actions" : `configure-pages` a le droit de
  #    l'activer, lui.
  #
  #    La branche gh-pages reste la reserve, et c'est son arbre entier qui part
  #    en ligne : les previews par branche sont donc preservees telles quelles.
  deployer:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      # Le jeton d'Actions peut modifier un site Pages existant, mais GitHub lui
      # refuse la CREATION d'un site, dans les deux modes, meme avec pages:write
      # accorde : "Resource not accessible by integration" sur
      # create-a-pages-site. Verifie sur ce depot par les deux voies.
      # Tant que le site n'existe pas, on ne fait pas echouer la livraison pour
      # autant : les controles et gh-pages, eux, sont bons. On previent, et le
      # jour ou Pages est active le deploiement repart tout seul.
      - name: Pages est-il actif ?
        id: etat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            echo "actif=oui" >> "$GITHUB_OUTPUT"
            echo "Pages actif, on deploie."
          else
            echo "actif=non" >> "$GITHUB_OUTPUT"
            echo "::warning title=Site non mis en ligne::GitHub Pages n'est pas active sur ce depot et le jeton d'Actions n'a pas le droit de creer le site. Reglage unique requis : Settings > Pages > Deploy from a branch > gh-pages > / (root). gh-pages est a jour, le site partira au prochain push une fois le reglage fait."
          fi

      - name: Recuperer la reserve
        if: steps.etat.outputs.actif == 'oui'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: site

      - name: Retirer le .git de la reserve
        if: steps.etat.outputs.actif == 'oui'
        # Sinon l'historique entier partirait dans l'artefact publie.
        run: rm -rf site/.git

      - name: Activer Pages si ce n'est pas deja fait
        if: steps.etat.outputs.actif == 'oui'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Televerser le site
        if: steps.etat.outputs.actif == 'oui'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deployer
        if: steps.etat.outputs.actif == 'oui'
        id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
