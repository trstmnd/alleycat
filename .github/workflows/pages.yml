name: pages

on:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

concurrency:
  group: gh-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # Epinglee au SHA du commit, pas au tag : un tag se deplace, un SHA non.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Controles
        run: sh check.sh

      - name: Construire _site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html style.css _site/
          cp -r src _site/
          # Jekyll ne doit pas toucher au site. peaceiris le pose deja, on ne
          # depend pas de lui pour un fichier aussi structurant.
          touch _site/.nojekyll
          # Empreinte de la livraison. Elle change a chaque commit, donc chaque
          # push produit un vrai commit sur gh-pages et GitHub Pages
          # reconstruit. Sans elle, un commit qui ne touche qu'a la doc ne
          # redeploie rien du tout et le site reste sur l'ancienne version sans
          # que rien ne le signale.
          # C'est aussi la seule sonde pour savoir ce qui est REELLEMENT en
          # ligne : ouvrir /version.txt repond le SHA servi.
          {
            echo "commit  $GITHUB_SHA"
            echo "branche $GITHUB_REF_NAME"
            echo "publie  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > _site/version.txt

      - name: Calculer le dossier de destination
        id: dest
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
          else
            echo "dir=preview/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier sur gh-pages
        # Action tierce qui tourne avec contents:write : epinglee au SHA.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
          destination_dir: ${{ steps.dest.outputs.dir }}

  # GitHub Pages ne s'active pas tout seul quand une branche gh-pages apparait :
  # les depots recents arrivent avec la source "GitHub Actions", qui ignore
  # completement cette branche. Le workflow tournait vert, gh-pages se
  # remplissait, et le site repondait 404 sans que rien ne le signale.
  # On le regle par l'API avec le jeton du workflow, plutot qu'a la main dans
  # l'interface. L'appel est idempotent : au bout du premier, il ne fait que
  # confirmer l'etat.
  reglage-pages:
    needs: publish
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Servir gh-pages a la racine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if gh api "repos/$REPO/pages" >/tmp/pages.json 2>/dev/null; then
            echo "Pages deja active, on confirme la source."
            methode=PUT
          else
            echo "Pages inactif, on l'active."
            methode=POST
          fi
          gh api -X "$methode" "repos/$REPO/pages" \
            -f 'build_type=legacy' \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/'
          echo "--- etat final ---"
          gh api "repos/$REPO/pages" --jq '{status, html_url, build_type, branche: .source.branch, dossier: .source.path}'
